outputs = { Targets = ["eDP-1"] }
enable_esc_key = true

[appearance]
scale_factor = 1.25
blur = "auto"

success_color = "#a6e3a1"
warning_color = "#f9e2af"
danger_color = "#f38ba8"
text_color = "#cdd6f4"

workspace_colors = [ "#fab387", "#b4befe", "#cba6f7" ]

[appearance.primary_color]
base = "#fab387"
text = "#1e1e2e"

[appearance.background_color]
base = "#1e1e2e"
weak = "#313244"
strong = "#45475a"

[appearance.bar]
surface = "transparent"
margin = [0.0, 8.0]

[osd]
enabled = true
show_volume_percentage = true
show_brightness_percentage = true

[animations]
enabled = true

[modules]
left = [ "MediaPlayer" ]
center = [ "Tempo" ]
right = [ "SystemInfo", "Tray", ["Privacy", "Settings", "Notifications"] ]

[system_info]
indicators = [ "Cpu", "Memory" ]
[system_info.memory]
format = "Amount"

[media_player]
indicator_format = "IconAndText"
menu_visualizer = true
indicator_visualizer = "After"

[settings]
lock_cmd = "hyprlock"
shutdown_cmd = "systemctl poweroff"
hibernate_cmd = "systemctl hibernate"

wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

remove_airplane_btn = true

# List of indicators
indicators = ["Audio", "Microphone", "Bluetooth", "Vpn", "Network", "PowerProfile", "IdleInhibitor", "Battery", "PeripheralBattery"]

# Indicator formats
battery_format = "IconAndPercentage"
network_indicator_format = "Icon"
audio_indicator_format = "Icon"
microphone_indicator_format = "Icon"

[workspaces]
visibility_mode = "All"
group_by_monitor = true
indicator_format = "NameAndIcons"

[notifications]
format = "%H:%M"
show_timestamps = true
show_bodies = true
grouped = true
toast = true
toast_position = "TopRight"
toast_timeout = 1000
toast_limit = 5
toast_max_height = 150
